<div id="app" class="app" data-state="idle" data-mic="off" data-thread="closed" data-panel="">
  <header class="topbar">
    <div class="brand" role="img" aria-label="G.E.N.I.S"><span class="mark" aria-hidden="true"></span><b>G<i>.</i>E<i>.</i>N<i>.</i>I<i>.</i>S</b></div>
    <nav id="spaceTabs" class="tabs" aria-label="Espaces de travail"></nav>
    <button id="overviewBtn" type="button" class="icon-btn" aria-label="Vue d’ensemble des espaces" title="Espaces (Ctrl+K)"><svg class="i" aria-hidden="true"><use href="#i-tiles"/></svg></button>
    <div class="status">
      <button id="gwChip" type="button" class="chip-btn" data-state="off"><i class="dot"></i>IA non configurée</button>
      <button id="micChip" type="button" class="chip-btn" data-on="false"><i class="dot"></i>Micro coupé</button>
      <time id="clock" class="clock"></time>
    </div>
  </header>
  <main id="stage" class="stage">
    <section class="hero" aria-label="G.E.N.I.S">
      <canvas id="wave" role="img" aria-label="G.E.N.I.S : en veille, micro coupé"></canvas>
      <div class="hero-text">
        <p id="stateLabel" class="state-label" aria-live="polite">En veille</p>
        <p id="caption" class="caption" aria-live="polite"></p>
        <ol id="rail" class="rail" aria-live="polite" data-show="0"></ol>
        <div id="chips" class="chips" hidden></div>
      </div>
      <button id="micBtn" type="button" class="mic-btn" aria-pressed="false" aria-label="Activer le microphone"><svg class="i" aria-hidden="true"><use href="#i-mic-off"/></svg></button>
    </section>
    <section id="thread" class="thread" aria-label="Conversation">
      <header><h2 id="threadTitle">Accueil</h2><div>
        <button id="historyBtn" type="button" class="icon-btn" aria-label="Historique des conversations" title="Historique"><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg></button>
        <button id="newSpaceBtn" type="button" class="icon-btn" aria-label="Nouvelle conversation" title="Nouvelle conversation"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button id="threadClose" type="button" class="icon-btn" aria-label="Fermer la conversation"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div></header>
      <div id="log" class="log" role="log" aria-live="polite" tabindex="0"></div>
    </section>
  </main>
  <form id="composer" class="composer" autocomplete="off">
    <div id="attachments" class="attachments" hidden></div>
    <div class="composer-row">
      <button type="button" id="attachBtn" class="icon-btn" aria-label="Joindre un fichier" title="Joindre un fichier"><svg class="i" aria-hidden="true"><use href="#i-clip"/></svg></button>
      <input type="file" id="fileInput" hidden multiple accept=".txt,.md,.csv,.tsv,.json,.html,.htm,.xml,.pdf,.docx,.xlsx,.xls,.pptx,image/*">
      <textarea id="prompt" rows="1" placeholder="Dites ou écrivez ce que vous voulez faire…" aria-label="Votre demande" enterkeyhint="send"></textarea>
      <button type="submit" id="sendBtn" class="send-btn" data-mode="send" aria-label="Envoyer" disabled><svg class="i" aria-hidden="true"><use href="#i-send"/></svg></button>
    </div>
  </form>
  <nav id="dock" class="dock" aria-label="Dock"></nav>
  <aside id="drawer" class="drawer" role="dialog" aria-labelledby="drawerTitle" hidden>
    <header><h2 id="drawerTitle"></h2><button id="drawerClose" type="button" class="icon-btn" aria-label="Fermer le panneau"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></header>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>
  <section id="overview" class="overview" hidden aria-label="Espaces de travail">
    <header><h2>Espaces</h2><button id="overviewClose" type="button" class="icon-btn" aria-label="Fermer la vue d’ensemble"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></header>
    <div id="overviewGrid" class="overview-grid"></div>
  </section>
  <aside id="media" class="media" hidden aria-label="Lecteur Deezer">
    <header><b id="mediaTitle"></b><button id="mediaToggle" type="button" class="icon-btn" aria-label="Réduire le lecteur"><svg class="i" aria-hidden="true"><use href="#i-chevron-left"/></svg></button><button id="mediaClose" type="button" class="icon-btn" aria-label="Fermer le lecteur"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></header>
    <iframe id="mediaFrame" title="Lecteur Deezer" allow="autoplay; encrypted-media; clipboard-write" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" height="200"></iframe>
  </aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modals"></div>
  <p id="boot-error" class="boot-error" hidden>G.E.N.I.S n’a pas pu démarrer. Rechargez la page ; si le problème persiste, ouvrez la console du navigateur.</p>
</div>
