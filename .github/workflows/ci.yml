name: GENIS quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genis-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: JavaScript syntax
        run: npm test
      - name: PWA manifest
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); if(!m.name || !m.icons?.some(i=>i.sizes==='192x192') || !m.icons?.some(i=>i.sizes==='512x512')) process.exit(1)"
      - name: Frontend assets
        run: |
          for f in index.html styles.css app.js brain.js storage.js voice.js waveform.js tools.js index.js manifest.webmanifest sw.js genis-192.png genis-512.png; do
            test -s "$f" || { echo "Missing or empty asset: $f"; exit 1; }
          done
      - name: Application runtime guards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app = fs.readFileSync('app.js', 'utf8');
          const html = fs.readFileSync('index.html', 'utf8');
          const workerSource = fs.readFileSync('worker.js', 'utf8');
          const css = fs.readFileSync('styles.css', 'utf8');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const voice = fs.readFileSync('voice.js', 'utf8');
          const waveform = fs.readFileSync('waveform.js', 'utf8');
          const brain = fs.readFileSync('brain.js', 'utf8');
          const storage = fs.readFileSync('storage.js', 'utf8');
          const brokenSelectors = app.match(/(?<!\$)\$\([^)]*\)\??\.forEach/g) || [];
          assert.equal(brokenSelectors.length, 0, 'Do not call forEach() on querySelector() results');
          for (const id of ['app','messages','promptForm','promptInput','micButton','drawer','drawerContent','fileInput','attachButton','dock']) {
            assert.ok(html.includes('id="' + id + '"'), 'Missing HTML element #' + id);
          }
          for (const moduleName of ['storage.js','voice.js','waveform.js','brain.js','tools.js','index.js']) {
            assert.ok(fs.existsSync(moduleName), 'Missing imported module: ' + moduleName);
          }
          assert.ok(html.includes('title="Fermer les réglages"'), 'Settings close control is missing');
          assert.ok(app.includes('function refreshVoiceSelector'), 'Voice selector is missing');
          assert.ok(app.includes('voiceName:settings.voiceName'), 'Selected voice is not connected to speech output');
          assert.ok(app.includes('isProcessingVoice=true;voice.stop()'), 'Speech input should stop while GENIS processes a transcript');
          assert.ok(voice.includes('lastRecognitionError'), 'Speech recognition error state must not be overwritten by onend');
          assert.ok(waveform.includes('prefers-reduced-motion: reduce'), 'Waveform must respect reduced-motion settings');
          assert.ok(app.includes('function buildAttachmentContext'), 'Attachment context size guard is missing');
          assert.ok(app.includes("const diagnostic='Échec pendant '+stage"), 'Action errors must expose the failing stage and original cause');
          assert.ok(!app.includes("toast('Action interrompue')"), 'Generic Action interrupted toast must be removed');
          assert.ok(app.includes('let isSending=false'), 'Concurrent sends must be guarded');
          assert.ok(brain.includes('export async function checkGatewayConnection'), 'Gateway connection diagnostic is missing');
          assert.ok(brain.includes('gatewayErrorForStatus'), 'Gateway HTTP errors must be classified');
          assert.ok(storage.includes('persistenceWarning') && storage.includes('volatileStore'), 'Storage quota errors must not stop the action');

          assert.ok(app.includes('activeChat.id'), 'Current chat id is not passed to history recall');
          assert.ok(app.includes('data-edit-auto-trigger') && app.includes('data-add-auto-action') && app.includes('data-remove-auto-action'), 'Automation edit and multi-action controls are missing');
          assert.ok(css.includes('grid-area:1 / 1'), 'Responsive conversation overlay must stay inside the workspace grid');
          assert.ok(workerSource.includes('readLimitedBody') && workerSource.includes('MAX_REQUEST_BYTES'), 'Gateway request size guard is missing');
          assert.ok(workerSource.includes("request.method==='GET'") && workerSource.includes("service:'GENIS Gateway'"), 'Worker health endpoint is missing');

          assert.ok(sw.includes("const CACHE='genis-v9';"), 'Service worker cache must be bumped when the app shell changes');
          console.log('GENIS runtime guards passed.');
          NODE
      - name: Frontend gateway diagnostic tests
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const values = new Map();
          globalThis.localStorage = {
            getItem: key => values.has(key) ? values.get(key) : null,
            setItem: (key, value) => values.set(key, String(value)),
            removeItem: key => values.delete(key),
            key: index => [...values.keys()][index] ?? null,
            get length() { return values.size; }
          };
          const settings = {
            gatewayUrl:'https://genis-worker.test/',
            gatewaySecret:'ci-only-secret',
            provider:'anthropic',
            model:'ci-model',
            voiceEnabled:false,
            speechRate:1,
            volume:1,
            voiceName:''
          };
          for (const [key,value] of Object.entries({
            settings,
            memories:[],
            chats:[],
            automations:[],
            tasks:[],
            notifications:[],
            permissions:{}
          })) localStorage.setItem('genis:'+key,JSON.stringify(value));

          let healthSecretAccepted = true;
          let postStatus = 200;
          globalThis.fetch = async (_url,init={}) => {
            if (init.method==='GET') {
              return new Response(JSON.stringify({
                status:'ok',
                service:'GENIS Gateway',
                version:'ci',
                appSecretConfigured:true,
                appSecretAccepted:healthSecretAccepted,
                providers:{anthropic:true,openai:true}
              }),{status:200,headers:{'content-type':'application/json'}});
            }
            if (postStatus!==200) return new Response(JSON.stringify({error:{message:'Clé API fournisseur invalide.'}}),{status:postStatus,headers:{'content-type':'application/json'}});
            return new Response(JSON.stringify({text:'GENIS OK',toolTrace:[]}),{status:200,headers:{'content-type':'application/json'}});
          };

          const {checkGatewayConnection,aiChat}=await import('./brain.js');
          const health=await checkGatewayConnection();
          assert.equal(health.provider,'anthropic');
          const answer=await aiChat('test',[]);
          assert.equal(answer.text,'GENIS OK');

          healthSecretAccepted=false;
          await assert.rejects(checkGatewayConnection(),/ne correspond pas à APP_SECRET/);

          healthSecretAccepted=true;
          postStatus=503;
          await assert.rejects(aiChat('test',[]),/Clé API fournisseur invalide/);

          settings.gatewayUrl='';
          localStorage.setItem('genis:settings',JSON.stringify(settings));
          await assert.rejects(checkGatewayConnection(),/URL de passerelle absente/);

          console.log('Frontend gateway diagnostics passed.');
          NODE
      - name: Gateway integration tests (Anthropic + OpenAI)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import workerModule from './worker.js';

          const worker = workerModule;
          const env = {
            APP_SECRET: 'ci-only-secret',
            ALLOWED_ORIGIN: 'https://sopp24.github.io',
            ANTHROPIC_API_KEY: 'ci-anthropic-key',
            OPENAI_API_KEY: 'ci-openai-key'
          };
          const origin = 'https://sopp24.github.io';
          const post = (body, secret='ci-only-secret', requestOrigin=origin) => new Request('https://genis-worker.test/', {
            method: 'POST',
            headers: {'content-type':'application/json','origin':requestOrigin,'x-app-secret':secret},
            body: JSON.stringify(body)
          });

          const healthResponse = await worker.fetch(new Request('https://genis-worker.test/', {
            method:'GET',
            headers:{'origin':origin,'x-app-secret':'ci-only-secret'}
          }),env);
          assert.equal(healthResponse.status,200,'Worker health endpoint should be reachable');
          const health=await healthResponse.json();
          assert.equal(health.status,'ok');
          assert.equal(health.service,'GENIS Gateway');
          assert.equal(health.appSecretConfigured,true);
          assert.equal(health.appSecretAccepted,true);
          assert.equal(health.providers.anthropic,true);
          const preflight=await worker.fetch(new Request('https://genis-worker.test/',{
            method:'OPTIONS',
            headers:{'origin':origin,'access-control-request-method':'GET','access-control-request-headers':'x-app-secret'}
          }),env);
          assert.equal(preflight.status,200);
          assert.match(preflight.headers.get('Access-Control-Allow-Methods')||'',/\\bGET\\b/,'Worker CORS must allow the GET health check');
          const unauthorized = await worker.fetch(post({messages:[{role:'user',content:'test'}]},'wrong-secret'),env);
          assert.equal(unauthorized.status,403,'Worker must reject a wrong APP_SECRET');
          const forbiddenOrigin = await worker.fetch(post({messages:[{role:'user',content:'test'}]},'ci-only-secret','https://untrusted.example'),env);
          assert.equal(forbiddenOrigin.status,403,'Worker must reject unlisted origins');

          const oversizedBody = JSON.stringify({messages:[{role:'user',content:'x'.repeat(270000)}]});
          const oversizedRequest = new Request('https://genis-worker.test/', {
            method:'POST',
            headers:{'content-type':'application/json','origin':origin,'x-app-secret':'ci-only-secret'},
            body:oversizedBody
          });
          const oversized = await worker.fetch(oversizedRequest,env);
          assert.equal(oversized.status,413,'Worker must reject oversized request bodies');

          let anthropicCalls=0;
          globalThis.fetch = async (url,init={}) => {
            assert.ok(String(url).includes('api.anthropic.com'));
            const payload=JSON.parse(init.body);
            anthropicCalls++;
            if(anthropicCalls===1){
              return new Response(JSON.stringify({content:[{type:'tool_use',id:'ci-calc-1',name:'calculate',input:{expression:'-2^2'}}]}),{status:200,headers:{'content-type':'application/json'}});
            }
            const last=payload.messages.at(-1);
            const calculation=JSON.parse(last.content[0].content);
            assert.equal(calculation.result,-4,'Calculator must respect unary/exponent precedence');
            return new Response(JSON.stringify({content:[{type:'text',text:'Résultat : -4'}]}),{status:200,headers:{'content-type':'application/json'}});
          };
          const anthropicResponse=await worker.fetch(post({provider:'anthropic',model:'ci-model',system:'test',max_tokens:512,messages:[{role:'user',content:'Calcule -2^2'}]}),env);
          assert.equal(anthropicResponse.status,200);
          const anthropicData=await anthropicResponse.json();
          assert.equal(anthropicData.text,'Résultat : -4');
          assert.equal(anthropicData.toolTrace[0].name,'calculate');
          assert.equal(anthropicData.toolTrace[0].ok,true);
          assert.equal(anthropicCalls,2);

          let openaiCalls=0;
          globalThis.fetch = async (url,init={}) => {
            assert.ok(String(url).includes('api.openai.com'));
            const payload=JSON.parse(init.body);
            openaiCalls++;
            if(openaiCalls===1){
              return new Response(JSON.stringify({choices:[{message:{role:'assistant',content:null,tool_calls:[{id:'ci-call-1',type:'function',function:{name:'calculate',arguments:'{"expression":"2+2"}'}}]}}]}),{status:200,headers:{'content-type':'application/json'}});
            }
            const last=payload.messages.at(-1);
            assert.equal(JSON.parse(last.content).result,4,'OpenAI tool result must be returned to the model');
            return new Response(JSON.stringify({choices:[{message:{role:'assistant',content:'4'}}]}),{status:200,headers:{'content-type':'application/json'}});
          };
          const openaiResponse=await worker.fetch(post({provider:'openai',model:'ci-model',system:'test',max_tokens:512,messages:[{role:'user',content:'Calcule 2+2'}]}),env);
          assert.equal(openaiResponse.status,200);
          const openaiData=await openaiResponse.json();
          assert.equal(openaiData.text,'4');
          assert.equal(openaiData.toolTrace[0].name,'calculate');
          assert.equal(openaiCalls,2);
          console.log('Anthropic/OpenAI gateway tests passed.');
          NODE
